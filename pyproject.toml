[project]
name = "robot-skills"
version = "0.1.0"
description = "Panda manipulation skills on ManiSkill: LLM-planned pick/place + carry, and RL-trained skills such as peg insertion."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mani_skill==3.0.1",
    "sapien==3.0.3",
    "gymnasium==1.4.0",
    "torch==2.9.1",
    "numpy==2.4.6",
    "scipy",
    "pyyaml==6.0.3",
    "stable-baselines3==2.9.0",
    "imageio[ffmpeg]",
    "pillow",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_skills"]

# CUDA 12.8 wheels (required for RTX 50-series / Blackwell GPUs).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
